name: Tests & rapport Allure

# ═══════════════════════════════════════════════════════════════════════════
#  Lance la suite de tests à chaque push / pull request, puis publie le
#  rapport Allure sur GitHub Pages : une URL unique, consultable par toute
#  l'équipe, avec l'historique et les courbes de tendance.
#
#  Activation (une seule fois, par un administrateur du dépôt) :
#    Settings → Pages → Source : « Deploy from a branch » → branche gh-pages, /(root)
#
#  URL du rapport :
#    https://blingard.github.io/sodepa_backend/
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: allure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests unitaires + rapport
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Les tests marqués @Tag("integration") exigent PostgreSQL, Kafka, Redis,
      # Keycloak et MinIO : ils sont exclus de la CI publique.
      - name: Exécuter les tests
        id: tests
        continue-on-error: true
        run: ./mvnw -B --no-transfer-progress test -DexcludedGroups=integration

      - name: Conserver les résultats bruts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 30

      # ── Historique : on récupère les tendances des exécutions précédentes ──
      - name: Récupérer l'historique publié
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Réinjecter l'historique
        if: always()
        run: |
          if [ -d gh-pages/last-history ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/last-history/. target/allure-results/history/
            echo "Historique repris depuis gh-pages."
          else
            echo "Première exécution : pas d'historique."
          fi

      - name: Ajouter les métadonnées d'exécution
        if: always()
        run: |
          mkdir -p target/allure-results
          cat > target/allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "SODEPA ERP — Tests",
            "buildOrder": ${{ github.run_number }},
            "buildName": "#${{ github.run_number }} — ${{ github.ref_name }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          EOF

      - name: Générer le rapport Allure
        if: always()
        run: |
          npm install -g allure-commandline --silent
          allure generate target/allure-results --clean -o allure-report
          cp -r allure-report/history allure-report/last-history

      - name: Publier le rapport sur GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Rapport Allure — build #${{ github.run_number }}"

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Rapport Allure"
            echo ""
            echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } >> "$GITHUB_STEP_SUMMARY"

      # Le rapport est publié même quand des tests échouent ; le job, lui,
      # doit refléter l'état réel de la suite.
      - name: Refléter l'état des tests
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Des tests ont échoué — voir le rapport Allure."
          exit 1
