# ════════════════════════════════════════════════════════════════════════════════
# Profil Spring Boot "test" – active le peuplement de données fictives
# Lancer avec :  ./mvnw spring-boot:run -Dspring-boot.run.profiles=test
# ou :           java -jar target/erp-*.jar --spring.profiles.active=test
# ════════════════════════════════════════════════════════════════════════════════

spring:
  # Désactiver le cache Redis en test pour simplifier le démarrage
  cache:
    type: simple

  jpa:
    hibernate:
      ddl-auto: update
    # Afficher les requêtes SQL générées pour le debug
    show-sql: true

logging:
  level:
    com.sodepa.erp.configuration.TestDataSeeder: DEBUG

sodepa:
  ged:
    hmac-secret: ${SODEPA_GED_HMAC_SECRET:sodepa-test-ged-hmac-local-key}
  seed:
    enabled: ${SODEPA_SEED_ENABLED:true}
    purge-on-startup: ${SODEPA_PURGE_ON_STARTUP:true}
    keep-bootstrap-roots: ${SODEPA_SEED_KEEP_BOOTSTRAP_ROOTS:true}
  notifications:
    sandbox:
      enabled: ${NOTIF_SANDBOX_ENABLED:true}
      redirect-email: ${NOTIF_SANDBOX_REDIRECT_EMAIL:}
      sms-dry-run: ${NOTIF_SANDBOX_SMS_DRY_RUN:true}
      whatsapp-dry-run: ${NOTIF_SANDBOX_WA_DRY_RUN:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
