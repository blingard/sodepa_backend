              - column: { name: description, value: "Organe exécutif suprême de la SODEPA" }
              - column: { name: type_parent_id, value: null }
              - column: { name: niveau_hierarchique, valueNumeric: 1 }
              - column: { name: actif, valueBoolean: true }
              - column: { name: couleur, value: "#4338ca" }
              - column: { name: icone, value: "solar:crown-line-duotone" }
