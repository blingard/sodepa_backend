databaseChangeLog:
  - changeSet:
      id: create-types-structures-table
      author: Antigravity-Sodepa
      changes:
        - createTable:
            tableName: types_structures
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: libelle
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: type_parent_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_type_struct_parent
                    references: types_structures(id)
              - column:
                  name: niveau_hierarchique
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: actif
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: couleur
                  type: VARCHAR(20)
                  defaultValue: "#4f46e5"
              - column:
                  name: icone
                  type: VARCHAR(50)
                  defaultValue: "solar:buildings-2-line-duotone"
              - column:
                  name: missions_types
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createIndex:
            indexName: idx_type_struct_parent
            tableName: types_structures
            columns:
              - column:
                  name: type_parent_id

  - changeSet:
      id: add-type-structure-fk-to-unites
      author: Antigravity-Sodepa
      changes:
        - addColumn:
            tableName: unites_organisationnelles
            columns:
              - column:
                  name: type_structure_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_unite_type_structure
                    references: types_structures(id)

  - changeSet:
      id: create-objectifs-unites-table
      author: Antigravity-Sodepa
      changes:
        - createTable:
            tableName: objectifs_unites
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: unite_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_objectif_unite
                    references: unites_organisationnelles(id)
              - column:
                  name: intitule
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: indicateur
                  type: VARCHAR(100)
              - column:
                  name: unite_mesure
                  type: VARCHAR(30)
                  defaultValue: "UNITES"
              - column:
                  name: valeur_cible
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: valeur_realisee
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: taux_atteinte
                  type: NUMERIC(5, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: annee_exercice
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: date_echeance
                  type: DATE
              - column:
                  name: statut
                  type: VARCHAR(30)
                  defaultValue: "EN_COURS"
                  constraints:
                    nullable: false
              - column:
                  name: responsable_nom
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createIndex:
            indexName: idx_objectif_unite
            tableName: objectifs_unites
            columns:
              - column:
                  name: unite_id
              - column:
                  name: annee_exercice

  - changeSet:
      id: seed-types-structures-sodepa
      author: Antigravity-Sodepa
      changes:
        # 1. Racine : Direction Générale
