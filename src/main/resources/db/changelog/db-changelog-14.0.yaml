databaseChangeLog:
  - changeSet:
      id: 20261104-1400-achats-marches-schema
      author: sodepa-dev
      changes:
        # Table 1: Répertoire des fournisseurs et prestataires agréés
        - createTable:
            tableName: achat_fournisseurs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: raison_sociale
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: numero_contribuable
                  type: VARCHAR(50)
              - column:
                  name: rccm
                  type: VARCHAR(50)
              - column:
                  name: regime_fiscal
                  type: VARCHAR(50)
                  defaultValue: "REEL"
              - column:
                  name: specialite
                  type: VARCHAR(150)
              - column:
                  name: adresse
                  type: VARCHAR(255)
              - column:
                  name: telephone
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(100)
              - column:
                  name: banque_nom
                  type: VARCHAR(100)
              - column:
                  name: compte_bancaire_rib
                  type: VARCHAR(50)
              - column:
                  name: agree_sodepa
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: date_agrement
                  type: DATE
              - column:
                  name: actif
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        # Table 2: Expressions de besoin
        - createTable:
            tableName: achat_expressions_besoin
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: numero
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: demandeur_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_eb_demandeur
                    references: rh_employes(id)
              - column:
                  name: demandeur_nom
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: unite_organisationnelle_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_eb_unite
                    references: unites_organisationnelles(id)
              - column:
                  name: structure_nom
                  type: VARCHAR(150)
              - column:
                  name: motif
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: date_expression
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: montant_estime_total
                  type: NUMERIC(18, 2)
                  defaultValueNumeric: 0
              - column:
                  name: stock_disponible
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: attestation_carence_etablie
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: budget_disponible
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: ligne_budgetaire_imputation
                  type: VARCHAR(100)
              - column:
                  name: statut
                  type: VARCHAR(40)
                  defaultValue: "BROUILLON"
                  constraints:
                    nullable: false
              - column:
                  name: date_creation
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        # Table 3: Lignes de l'expression de besoin
        - createTable:
            tableName: achat_expression_besoin_lignes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: expression_besoin_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ligne_eb
                    references: achat_expressions_besoin(id)
              - column:
                  name: ordre
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: designation
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: specifications_techniques
                  type: TEXT
              - column:
                  name: quantite
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: unite_mesure
                  type: VARCHAR(30)
                  defaultValue: "U"
              - column:
                  name: prix_unitaire_estime
                  type: NUMERIC(18, 2)
                  defaultValueNumeric: 0
              - column:
                  name: montant_total_estime
                  type: NUMERIC(18, 2)
                  defaultValueNumeric: 0

        # Table 4: Dossiers d'achat, Bons de Commande & Marchés Publics
        - createTable:
            tableName: marche_dossiers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: numero_dossier
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: type_procedure
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: objet
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expression_besoin_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_marche_eb
                    references: achat_expressions_besoin(id)
              - column:
                  name: fournisseur_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_marche_fournisseur
                    references: achat_fournisseurs(id)
              - column:
                  name: fournisseur_nom
                  type: VARCHAR(200)
              - column:
                  name: montant_ht
                  type: NUMERIC(18, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: montant_tva
                  type: NUMERIC(18, 2)
                  defaultValueNumeric: 0
              - column:
                  name: montant_ttc
                  type: NUMERIC(18, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: ligne_budgetaire_code
                  type: VARCHAR(100)
              - column:
                  name: delai_livraison_jours
                  type: INT
                  defaultValueNumeric: 90
              - column:
                  name: date_notification
                  type: DATE
              - column:
                  name: date_limite_livraison
                  type: DATE
              - column:
                  name: statut
                  type: VARCHAR(40)
                  defaultValue: "BROUILLON"
                  constraints:
                    nullable: false
              - column:
                  name: proformas_obtenues_count
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: examen_cipm_requis
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: date_creation
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        # Table 5: Lignes d'articles du Bon de Commande / Marché
        - createTable:
            tableName: marche_dossier_lignes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: dossier_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ligne_dossier
                    references: marche_dossiers(id)
              - column:
                  name: ordre
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: designation
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantite
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: unite_mesure
                  type: VARCHAR(30)
                  defaultValue: "U"
              - column:
                  name: prix_unitaire_ht
                  type: NUMERIC(18, 2)
                  constraints:
                    nullable: false
              - column:
                  name: montant_ht
                  type: NUMERIC(18, 2)
                  constraints:
                    nullable: false
              - column:
                  name: taux_tva
                  type: NUMERIC(6, 4)
                  defaultValueNumeric: 0.1925
              - column:
                  name: montant_ttc
                  type: NUMERIC(18, 2)
                  constraints:
                    nullable: false

        # Table 6: Procès-Verbaux de Réception Technique (PV)
        - createTable:
            tableName: marche_receptions_pv
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: numero_pv
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: dossier_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_pv_dossier
                    references: marche_dossiers(id)
              - column:
                  name: date_reception
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: lieu_reception
                  type: VARCHAR(150)
              - column:
                  name: resultat_conformite
                  type: VARCHAR(40)
                  defaultValue: "CONFORME_SANS_RESERVE"
                  constraints:
                    nullable: false
              - column:
                  name: observations
                  type: TEXT
              - column:
                  name: numero_facture_definitive
                  type: VARCHAR(100)
              - column:
                  name: montant_facture_liquide
                  type: NUMERIC(18, 2)
              - column:
                  name: liquidation_validee
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: date_liquidation
                  type: TIMESTAMP

