databaseChangeLog:
  - changeSet:
      id: notif-31-01-evolve-sys-notifications
      author: sodepa-erp
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: sys_notifications
        - not:
            - columnExists:
                tableName: sys_notifications
                columnName: group_id
      changes:
        - addColumn:
            tableName: sys_notifications
            columns:
              - column: { name: group_id, type: UUID }
              - column: { name: parent_notification_id, type: UUID }
              - column: { name: idempotency_key, type: VARCHAR(160) }
              - column: { name: provider_name, type: VARCHAR(60) }
              - column: { name: provider_message_id, type: VARCHAR(160) }
              - column: { name: fallback_used, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: retry_count, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: next_retry_at, type: TIMESTAMP }
              - column: { name: message_html, type: TEXT }
              - column: { name: destinataire_whatsapp, type: VARCHAR(40) }
              - column: { name: template_code, type: VARCHAR(80) }
              - column: { name: metadata_json, type: TEXT }
        - addUniqueConstraint:
            tableName: sys_notifications
            columnNames: idempotency_key
            constraintName: uk_sys_notifications_idempotency_key
        - createIndex:
            indexName: idx_sys_notif_user_canal_statut
            tableName: sys_notifications
            columns:
              - column: { name: destinataire_utilisateur_id }
              - column: { name: canal }
              - column: { name: statut }
              - column: { name: date_envoi }
        - createIndex:
            indexName: idx_sys_notif_group_id
            tableName: sys_notifications
            columns:
              - column: { name: group_id }
        - createIndex:
            indexName: idx_sys_notif_parent_id
            tableName: sys_notifications
            columns:
              - column: { name: parent_notification_id }

  - changeSet:
      id: notif-31-02-normalize-legacy-statuts
      author: sodepa-erp
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: sys_notifications
      changes:
        - sql:
            splitStatements: false
            sql: |
              UPDATE public.sys_notifications SET statut = 'SENT' WHERE statut IN ('SEND', 'ENVOYEE');
              UPDATE public.sys_notifications SET statut = 'READ' WHERE statut = 'LUE';
              ALTER TABLE public.sys_notifications ALTER COLUMN statut SET DEFAULT 'PENDING';

  - changeSet:
      id: notif-31-03-create-outbox
      author: sodepa-erp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sys_notification_outbox
      changes:
        - createTable:
            tableName: sys_notification_outbox
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: notification_id, type: UUID, constraints: { nullable: false } }
              - column: { name: group_id, type: UUID }
              - column: { name: canal, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: type_evenement, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: payload_json, type: TEXT, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), defaultValue: "PENDING", constraints: { nullable: false } }
              - column: { name: retry_count, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: next_retry_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: last_error, type: VARCHAR(500) }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: published_at, type: TIMESTAMP }
              - column: { name: processed_at, type: TIMESTAMP }
        - addUniqueConstraint:
            tableName: sys_notification_outbox
            columnNames: notification_id
            constraintName: uk_notif_outbox_notification_id
        - addForeignKeyConstraint:
            baseTableName: sys_notification_outbox
            baseColumnNames: notification_id
            constraintName: fk_notif_outbox_notification
            referencedTableName: sys_notifications
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_notif_outbox_pending
            tableName: sys_notification_outbox
            columns:
              - column: { name: status }
              - column: { name: next_retry_at }
              - column: { name: created_at }

  - changeSet:
      id: notif-31-04-create-rules-prefs-templates
      author: sodepa-erp
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE IF NOT EXISTS public.sys_notification_rules (
                id UUID PRIMARY KEY,
                type_evenement VARCHAR(60) NOT NULL,
                canal VARCHAR(30) NOT NULL,
                actif BOOLEAN NOT NULL DEFAULT TRUE,
                critique BOOLEAN NOT NULL DEFAULT FALSE,
                ordre_priorite INT NOT NULL DEFAULT 10,
                fallback_canal VARCHAR(30),
                description VARCHAR(255),
                updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_by VARCHAR(100),
                CONSTRAINT uk_notif_rule_event_canal UNIQUE (type_evenement, canal)
              );

              CREATE TABLE IF NOT EXISTS public.sys_notification_user_prefs (
                id UUID PRIMARY KEY,
                utilisateur_id UUID NOT NULL,
                email_enabled BOOLEAN NOT NULL DEFAULT TRUE,
                sms_enabled BOOLEAN NOT NULL DEFAULT TRUE,
                whatsapp_enabled BOOLEAN NOT NULL DEFAULT TRUE,
                in_app_enabled BOOLEAN NOT NULL DEFAULT TRUE,
                whatsapp_phone VARCHAR(40),
                langue VARCHAR(10) NOT NULL DEFAULT 'fr',
                updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uk_notif_user_prefs_user UNIQUE (utilisateur_id)
              );

              CREATE TABLE IF NOT EXISTS public.sys_notification_templates (
                id UUID PRIMARY KEY,
                code VARCHAR(80) NOT NULL,
                type_evenement VARCHAR(60) NOT NULL,
                langue VARCHAR(10) NOT NULL DEFAULT 'fr',
                sujet_template VARCHAR(250) NOT NULL,
                body_text_template TEXT NOT NULL,
                body_html_template TEXT,
                whatsapp_template_name VARCHAR(120),
                whatsapp_param_order VARCHAR(500),
                allowed_placeholders VARCHAR(500),
                actif BOOLEAN NOT NULL DEFAULT TRUE,
                updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_by VARCHAR(100),
                CONSTRAINT uk_notif_templates_code UNIQUE (code),
                CONSTRAINT uk_notif_templates_event_lang UNIQUE (type_evenement, langue)
              );

