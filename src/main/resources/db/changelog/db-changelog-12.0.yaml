  - changeSet:
      id: 20261103-04-create-rh-employes
      author: SODEPA-ERP
      changes:
        - createTable:
            tableName: rh_employes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: matricule
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: sexe
                  type: VARCHAR(1)
                  constraints:
                    nullable: false
              - column:
                  name: date_naissance
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: lieu_naissance
                  type: VARCHAR(100)
              - column:
                  name: situation_matrimoniale
                  type: VARCHAR(20)
                  defaultValue: "CELIBATAIRE"
                  constraints:
                    nullable: false
              - column:
                  name: nombre_enfants_a_charge
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
              - column:
                  name: telephone
                  type: VARCHAR(50)
              - column:
                  name: adresse
                  type: VARCHAR(255)
              - column:
                  name: numero_cnps
                  type: VARCHAR(50)
              - column:
                  name: compte_bancaire_rib
                  type: VARCHAR(50)
              - column:
                  name: banque_nom
                  type: VARCHAR(100)
              - column:
                  name: type_contrat
                  type: VARCHAR(30)
                  defaultValue: "CDI"
                  constraints:
                    nullable: false
              - column:
                  name: date_embauche
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: date_fin_essai
                  type: DATE
              - column:
                  name: date_fin_contrat
                  type: DATE
              - column:
                  name: statut_activite
                  type: VARCHAR(30)
                  defaultValue: "EN_FONCTION"
                  constraints:
                    nullable: false
              - column:
                  name: unite_organisationnelle_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_employe_unite
                    references: unites_organisationnelles(id)
              - column:
                  name: poste_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_employe_poste
                    references: postes(id)
              - column:
                  name: grille_salariale_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_employe_grille
                    references: rh_grille_salariale(id)
              - column:
                  name: user_id
                  type: VARCHAR(100)
              - column:
                  name: date_creation
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 20261103-05-create-achat-seuils-config
      author: SODEPA-ERP
      changes:
        - createTable:
            tableName: achat_seuils_config
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type_procedure
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: libelle
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: montant_min_ttc
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: montant_max_ttc
                  type: NUMERIC(15, 2)
              - column:
                  name: nb_proformas_requis
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: commission_requise
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: actif
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

