databaseChangeLog:
  - changeSet:
      id: 20261103-01-create-ged-documents
      author: SODEPA-ERP
      changes:
        - createTable:
            tableName: ged_documents
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nom_fichier
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: taille_octets
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: hash_sha256
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: s3_cle
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: s3_bucket
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: type_entite
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: entite_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: date_upload
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: upload_par
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

  - changeSet:
      id: 20261103-02-create-rh-grille-salariale
      author: SODEPA-ERP
      changes:
        - createTable:
            tableName: rh_grille_salariale
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: categorie
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: echelon
                  type: VARCHAR(2)
                  constraints:
                    nullable: false
              - column:
                  name: groupe
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: salaire_base
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: taux_horaire
                  type: NUMERIC(10, 2)
              - column:
                  name: actif
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: rh_grille_salariale
            columnNames: categorie, echelon
            constraintName: uq_grille_cat_echelon

