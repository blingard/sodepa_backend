# Changelog 34.0 — structures budgétaires (US-BUD-107, ticket #48).
#
# Une structure est une unité de l'organigramme qui porte un budget. Elle ne
# recopie rien de l'unité : elle y ajoute le poste de l'ordonnateur et l'unité
# du service d'engagement, tous deux pris dans l'organigramme.
databaseChangeLog:
  - changeSet:
      id: 34.0-01-budget-structure
      author: sodepa-erp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: budget_structure
      changes:
        - createTable:
            tableName: budget_structure
            remarks: Unité de l'organigramme portant un budget, avec son ordonnateur et son service d'engagement
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_budget_structure, nullable: false } }
              # Une seule structure par unité, active ou désactivée.
              - column: { name: unite_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_budget_structure_unite, foreignKeyName: fk_budget_structure_unite, references: unites_organisationnelles(id) } }
              # Un poste, pas une personne : le signataire se lit sur l'affectation active.
              - column: { name: ordonnateur_poste_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_budget_structure_ordonnateur, references: postes(id) } }
              - column: { name: service_engagement_unite_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_budget_structure_service, references: unites_organisationnelles(id) } }
              - column: { name: actif, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: motif_desactivation, type: varchar(1000) }
              - column: { name: demande_creation_id, type: uuid }
              - column: { name: cree_par, type: varchar(100), constraints: { nullable: false } }
              - column: { name: cree_le, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: valide_par, type: varchar(100), constraints: { nullable: false } }
              - column: { name: valide_le, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: modifie_par, type: varchar(100) }
              - column: { name: modifie_le, type: timestamp with time zone }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
