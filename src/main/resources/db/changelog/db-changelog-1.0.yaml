databaseChangeLog:
  - changeSet:
      id: 20260810-create-comptes-table
      author: ELLA BELINGA Jean Paul
      changes:
        - createTable:
            tableName: comptes
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(20)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: intitule
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: parent_code
                  type: varchar(20)
                  constraints:
                    nullable: true
              - column:
                  name: niveau
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: type_analytique
                  type: varchar(50)
                  constraints:
                    nullable: true
              - column:
                  name: nature
                  type: varchar(50)
                  constraints:
                    nullable: true
              - column:
                  name: is_auxiliaire
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_comptes_code
            tableName: comptes
            columns:
              - column:
                  name: code
        - createIndex:
            indexName: idx_comptes_parent_code
            tableName: comptes
            columns:
              - column:
                  name: parent_code
