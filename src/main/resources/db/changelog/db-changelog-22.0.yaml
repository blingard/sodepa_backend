                tableName: ref_abattage_transformation
      changes:
        - createTable:
            tableName: ref_abattage_transformation
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: VARCHAR(50), constraints: { nullable: false, unique: true } }
              - column: { name: libelle, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: type_norme, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: code_espece, type: VARCHAR(30), defaultValue: "BOVINE", constraints: { nullable: false } }
              - column: { name: code_race, type: VARCHAR(40) }
              - column: { name: rendement_min_pct, type: "DECIMAL(5,2)" }
              - column: { name: rendement_cible_pct, type: "DECIMAL(5,2)" }
              - column: { name: rendement_max_pct, type: "DECIMAL(5,2)" }
              - column: { name: perte_max_ressuyage_pct, type: "DECIMAL(5,2)" }
              - column: { name: temperature_consigne_celsius, type: "DECIMAL(5,2)" }
              - column: { name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }

  - changeSet:
      id: ref03-08-create-ref-unites-mesure
      author: sodepa-erp
      preConditions:
        - onFail: MARK_RAN
        - not:
