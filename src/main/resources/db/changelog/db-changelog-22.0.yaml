            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: VARCHAR(20), constraints: { nullable: false, unique: true } }
              - column: { name: libelle, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: symbole, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: dimension_physique, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: decimales_autorisees, type: INT, defaultValueNumeric: 2, constraints: { nullable: false } }
              - column: { name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }

  - changeSet:
      id: ref03-09-create-ref-conversions-unites
