databaseChangeLog:
  - changeSet:
      id: 17.0-01-create-parametres-systeme-table
      author: sodepa-erp
      changes:
        - createTable:
            tableName: app_parametres_systeme
            columns:
              - column:
                  name: cle
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: valeur
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: type_valeur
                  type: VARCHAR(30)
                  constraints:
                    nullable: false # DECIMAL, INTEGER, STRING, BOOLEAN
              - column:
                  name: categorie
                  type: VARCHAR(50)
                  constraints:
                    nullable: false # PAIE, ACHATS, CHEPTEL, TRESORERIE, FORMATION, SECURITE
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: modifiable_par
                  type: VARCHAR(100)
                  defaultValue: "ADMIN,DAF,DRH"
              - column:
                  name: derniere_modification
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: modifie_par
                  type: VARCHAR(100)
                  defaultValue: "SYSTEM_INITIALIZER"

  - changeSet:
      id: 17.0-02-seed-parametres-systeme
      author: sodepa-erp
