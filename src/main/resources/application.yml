spring:
  profiles:
    active: ${PROFILE}
  devtools:
    restart:
      enabled: false
      poll-interval: 5000
      quiet-period: 4000
  application:
    name: erp
  cache:
    type: redis
  data:
    redis:
      port: ${REDIS_PORT}
      host: ${REDIS_IP}
      password: ${REDIS_PASSWORD}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 5000
      validation-timeout: 2500
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL}
    show-sql: ${DB_SHOW_SQL}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${DB_SHOW_SQL_FORMAT}
  liquibase:
    change-log: classpath:db/changelog/db-changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_IP}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5000
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 5000ms
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_URI}
          jwk-set-uri: ${JWK_URI}
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${JWT_URI}


server:
  port: ${SERVER_PORT}
  shutdown: graceful
  forward-headers-strategy: native

# Keycloak Admin
keycloak:
  default-password: ${KEYCLOAK_DEFAULT_PASSWORD}
  admin:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

# Minio
minio:
  endpoint: ${MINIO_ENDPOINT}
  fileurl: ${MINIO_FILEURL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: avatars
  bucket-name: avatars
  region: us-east-1
  enabled: true

# Springdoc
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method

collabora:
  url: ${COLLABORA_URL}
app:
  public_url: ${BACK_END_BASE_URL}
  duration: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  interceptor-throttle:
    enabled: true
    default-rule:
      name: sodepa-default-catchall
      limit: 30
      duration-seconds: 60
      key-type: AUTHENTICATED_ENDPOINT
      include-path-in-key: true
      failure-policy: FAIL_CLOSED
    rules:
      # ── Authentication (public endpoints) ──
      - name: sodepa-auth-public
        path-patterns:
          - /api/auth/login
          - /api/auth/refresh
          - /api/auth/logout
        methods:
          - POST
        limit: 10
        duration-seconds: 60
        key-type: PUBLIC_ENDPOINT
        include-path-in-key: false
        failure-policy: FAIL_CLOSED
      - name: sodepa-auth-sessions
        path-patterns:
          - /api/auth/sessions
          - /api/auth/sessions/**
          - /api/auth/change-password
        limit: 10
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── User Management ──
      - name: sodepa-user-read
        path-patterns:
          - /api/v1/users
          - /api/v1/users/search
          - /api/v1/users/**
        methods:
          - GET
        limit: 30
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      - name: sodepa-user-write
        path-patterns:
          - /api/v1/users/**
        methods:
          - POST
          - PUT
        limit: 10
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Audit ──
      - name: sodepa-audit
        path-patterns:
          - /api/auth/audit/**
        methods:
          - GET
        limit: 20
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Gestion budgétaire reconstruite : exercices (US-BUD-101) ──
      # Écriture rare (un exercice par an) : la limite basse suffit et freine
      # les soumissions en rafale.
      - name: sodepa-budget-exercices-write
        path-patterns:
          - /api/budget/exercices/**
        methods:
          - POST
        limit: 10
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      - name: sodepa-budget-exercices-read
        path-patterns:
          - /api/budget/exercices
          - /api/budget/exercices/**
        methods:
          - GET
        limit: 60
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Gestion budgétaire reconstruite : nomenclature (US-BUD-104) ──
      # La saisie d'un plan de codification enchaîne les créations : la limite
      # d'écriture est plus haute que pour les exercices.
      - name: sodepa-budget-nomenclature-write
        path-patterns:
          - /api/budget/nomenclature/**
        methods:
          - POST
        limit: 60
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      - name: sodepa-budget-nomenclature-read
        path-patterns:
          - /api/budget/nomenclature/**
        methods:
          - GET
        limit: 120
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Gestion budgétaire reconstruite : structures (US-BUD-107) ──
      # Quelques structures par an au plus : la limite basse suffit.
      - name: sodepa-budget-structures-write
        path-patterns:
          - /api/budget/structures/**
        methods:
          - POST
        limit: 20
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      - name: sodepa-budget-structures-read
        path-patterns:
          - /api/budget/structures
          - /api/budget/structures/**
        methods:
          - GET
        limit: 120
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Comptabilité générale (write: écritures, rapprochement, clôture) ──
      - name: sodepa-compta-generale-write
        path-patterns:
          - /api/comptabilite/ecritures
          - /api/comptabilite/ecritures/**
          - /api/comptabilite/rapprochement/**
          - /api/comptabilite/cloture/**
          - /api/comptabilite/journaux/init_create
          - /api/comptabilite/journaux/init_update/**
          - /api/comptabilite/journaux/validate_or_reject/**
          - /api/v1/caccounting/compte/init_create
          - /api/v1/caccounting/compte/init_update/**
          - /api/v1/caccounting/compte/validate_or_reject/**
          - /api/v1/caccounting/bank/init_create
          - /api/v1/caccounting/bank/init_update/**
          - /api/v1/caccounting/bank/init_update_image/**
          - /api/v1/caccounting/bank/validate_or_reject/**
          - /api/v1/caccounting/tiers/init_create
          - /api/v1/caccounting/tiers/init_update/**
          - /api/v1/caccounting/tiers/validate_or_reject/**
        methods:
          - POST
          - PUT
          - DELETE
        limit: 15
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Comptabilité générale (read) ──
      - name: sodepa-compta-generale-read
        path-patterns:
          - /api/v1/caccounting/compte/**
          - /api/v1/caccounting/bank/**
          - /api/v1/caccounting/tiers/**
          - /api/comptabilite/journaux/**
          - /api/comptabilite/ecritures/**
        methods:
          - GET
        limit: 30
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Comptabilité analytique (write) ──
      - name: sodepa-compta-analytique-write
        path-patterns:
          - /api/comptabilite/analytique/axes
          - /api/comptabilite/analytique/axes/**
          - /api/comptabilite/analytique/lignes/**
          - /api/comptabilite/analytique/budgets
          - /api/comptabilite/analytique/cles
          - /api/comptabilite/analytique/cles/**
        methods:
          - POST
          - PUT
        limit: 15
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Comptabilité analytique (read) ──
      - name: sodepa-compta-analytique-read
        path-patterns:
          - /api/comptabilite/analytique/**
        methods:
          - GET
        limit: 30
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Reporting (all modules) ──
      - name: sodepa-reporting
        path-patterns:
          - /api/comptabilite/reporting/**
          - /api/comptabilite/analytique/reporting/**
        methods:
          - GET
        limit: 20
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Trésorerie (read) ──
      - name: sodepa-tresorerie-read
        path-patterns:
          - /api/tresorerie/**
        methods:
          - GET
        limit: 30
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      # ── Immobilisations ──
      - name: sodepa-immobilisations-write
        path-patterns:
          - /api/v1/immobilisations/init_create
          - /api/v1/immobilisations/init_amortir
          - /api/v1/immobilisations/validate_or_reject/**
        methods:
          - POST
          - PUT
        limit: 15
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED
      - name: sodepa-immobilisations-read
        path-patterns:
          - /api/v1/immobilisations/**
        methods:
          - GET
        limit: 30
        duration-seconds: 60
        key-type: AUTHENTICATED_ENDPOINT
        failure-policy: FAIL_CLOSED

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  datadog:
    metrics:
      export:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

clickhouse:
  url: jdbc:ch://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}/${CLICKHOUSE_DB}?compress=0&decompress=0&connect_timeout=2000&socket_timeout=5000
  url-http: http://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}
  username: ${CLICKHOUSE_USERNAME:default}
  password: ${CLICKHOUSE_PASSWORD:}

sodepa:
  seed:
    enabled: ${SODEPA_SEED_ENABLED:false}
    purge-on-startup: ${SODEPA_PURGE_ON_STARTUP:false}
    keep-bootstrap-roots: ${SODEPA_SEED_KEEP_BOOTSTRAP_ROOTS:false}
  notifications:
    async-enabled: ${NOTIF_ASYNC_ENABLED:true}
    max-retries: ${NOTIF_MAX_RETRIES:5}
    initial-backoff-seconds: ${NOTIF_BACKOFF_SECONDS:10}
    outbox-batch-size: ${NOTIF_OUTBOX_BATCH_SIZE:50}
    outbox-replay-ms: ${NOTIF_OUTBOX_REPLAY_MS:15000}
    mail:
      enabled: ${NOTIF_MAIL_ENABLED:true}
      from-address: ${NOTIF_MAIL_FROM:noreply@sodepa.cm}
      from-name: ${NOTIF_MAIL_FROM_NAME:ERP SODEPA}
    sandbox:
      enabled: ${NOTIF_SANDBOX_ENABLED:true}
      redirect-email: ${NOTIF_SANDBOX_REDIRECT_EMAIL:}
      sms-dry-run: ${NOTIF_SANDBOX_SMS_DRY_RUN:true}
      whatsapp-dry-run: ${NOTIF_SANDBOX_WA_DRY_RUN:true}
    sms:
      enabled: ${NOTIF_SMS_ENABLED:true}
      default-country-code: ${NOTIF_SMS_COUNTRY_CODE:+237}
      provider-order: africa_talking,nexah,infobip,twilio,sandbox
      africa-talking:
        enabled: ${SMS_AFRICA_TALKING_ENABLED:false}
        base-url: ${SMS_AFRICA_TALKING_URL:https://api.africastalking.com/version1/messaging}
        username: ${SMS_AFRICA_TALKING_USERNAME:}
        api-key: ${SMS_AFRICA_TALKING_API_KEY:}
        sender-id: ${SMS_AFRICA_TALKING_SENDER_ID:SODEPA}
      nexah:
        enabled: ${SMS_NEXAH_ENABLED:false}
        base-url: ${SMS_NEXAH_URL:https://api.nexah.net/api/v1/sms/send}
        user: ${SMS_NEXAH_USER:}
        password: ${SMS_NEXAH_PASSWORD:}
        api-key: ${SMS_NEXAH_API_KEY:}
        sender-id: ${SMS_NEXAH_SENDER_ID:SODEPA}
      infobip:
        enabled: ${SMS_INFOBIP_ENABLED:false}
        base-url: ${SMS_INFOBIP_URL:https://api.infobip.com/sms/2/text/advanced}
        api-key: ${SMS_INFOBIP_API_KEY:}
        sender-id: ${SMS_INFOBIP_SENDER_ID:SODEPA}
      twilio:
        enabled: ${SMS_TWILIO_ENABLED:false}
        base-url: ${SMS_TWILIO_URL:https://api.twilio.com/2010-04-01}
        account-sid: ${SMS_TWILIO_ACCOUNT_SID:}
        auth-token: ${SMS_TWILIO_AUTH_TOKEN:}
        from-number: ${SMS_TWILIO_FROM:}
    whatsapp:
      enabled: ${NOTIF_WA_ENABLED:true}
      fallback-to-sms-on-failure: ${NOTIF_WA_FALLBACK_SMS:true}
      provider-order: meta_whatsapp,twilio_whatsapp,sandbox
      meta:
        enabled: ${WA_META_ENABLED:false}
        api-url: ${WA_META_API_URL:https://graph.facebook.com/v21.0}
        phone-number-id: ${WA_META_PHONE_NUMBER_ID:}
        access-token: ${WA_META_ACCESS_TOKEN:}
        default-language: ${WA_META_LANGUAGE:fr}
      twilio:
        enabled: ${WA_TWILIO_ENABLED:false}
        base-url: ${WA_TWILIO_URL:https://api.twilio.com/2010-04-01}
        account-sid: ${WA_TWILIO_ACCOUNT_SID:}
        auth-token: ${WA_TWILIO_AUTH_TOKEN:}
        from-number: ${WA_TWILIO_FROM:}
