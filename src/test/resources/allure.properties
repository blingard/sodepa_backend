# ═══════════════════════════════════════════════════════════════════════════
#  Configuration Allure — projet SODEPA ERP
# ═══════════════════════════════════════════════════════════════════════════

# Dossier où les tests déposent les résultats bruts (JSON + pièces jointes).
allure.results.directory=target/allure-results

# ── Liens cliquables depuis le rapport ────────────────────────────────────
# @Issue("1234")  → ticket GitHub
allure.link.issue.pattern=https://github.com/blingard/sodepa_backend/issues/{}

# @TmsLink("SODEPA-42") → fiche du cas de test.
# Remplacer par l'URL Allure TestOps le jour où le serveur est en place :
#   https://<votre-testops>/project/1/test-cases/{}
allure.link.tms.pattern=https://github.com/blingard/sodepa_backend/issues/{}

# @Link(name = "spec", type = "specification", value = "...")
allure.link.specification.pattern={}
